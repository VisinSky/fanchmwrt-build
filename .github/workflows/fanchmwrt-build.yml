# 由 FanchmWrt Builder 自动生成，请勿手工修改（重新初始化会覆盖）
name: FanchmWrt Firmware
run-name: FanchmWrt ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: 任务 ID（对应 jobs/<id> 目录）
        required: true
      repo_url:
        description: 源码仓库地址
        required: false
        default: https://github.com/fanchmwrt/fanchmwrt.git
      branch:
        description: 源码分支
        required: false
        default: fanchmwrt-25.12.6
      release_tag:
        description: 产物发布使用的 Release 标签
        required: true

permissions:
  contents: write

concurrency:
  group: fanchmwrt-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: 检出构建配置
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get -y clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gcc-multilib g++-multilib gettext \
            git libncurses-dev libssl-dev python3-setuptools python3-pip rsync unzip \
            zlib1g-dev file wget curl cmake ninja-build libelf-dev libtool libtool-bin \
            m4 intltool pkg-config subversion swig ccache qemu-utils bzip2 xz-utils \
            patch perl python3 python3-dev liblzma-dev libffi-dev libxml2-dev

      - name: 缓存下载的源码包
        uses: actions/cache@v4
        with:
          path: /home/runner/dl
          key: dl-${{ inputs.branch }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ inputs.branch }}-

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ inputs.branch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.branch }}-

      - name: 缓存源码镜像（加速后续运行，避免每次重新克隆全量源码）
        uses: actions/cache@v4
        with:
          path: /home/runner/src-mirror
          key: mirror-${{ inputs.branch }}-${{ github.run_id }}
          restore-keys: |
            mirror-${{ inputs.branch }}-

      - name: 执行编译
        env:
          JOB: ${{ inputs.job }}
          SHARE: /home/runner/share
          SRC: /home/runner/openwrt
          SRC_MIRROR: /home/runner/src-mirror/repo.git
          DL: /home/runner/dl
          CCACHE_DIR: /home/runner/.ccache
          REPO_URL: ${{ inputs.repo_url }}
          BRANCH: ${{ inputs.branch }}
          JOBS: "0"
          USE_CCACHE: "1"
          VERBOSE: "0"
        run: |
          set -e
          mkdir -p /home/runner/share
          rm -rf "/home/runner/share/$JOB"
          cp -r "jobs/$JOB" "/home/runner/share/$JOB"
          bash "/home/runner/share/$JOB/run.sh"

      - name: 发布固件到 Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          JOB: ${{ inputs.job }}
        run: |
          set -e
          OUT="/home/runner/share/$JOB/out"
          shopt -s nullglob
          files=()
          for f in "$OUT"/*; do
            case "$f" in
              *.json|*.config|*.log) continue ;;
            esac
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有可发布的固件产物，跳过 Release"
            exit 0
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "FanchmWrt 固件 $JOB" \
                 --notes "由 FanchmWrt Builder 自动构建，任务 $JOB。"
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "已发布 ${#files[@]} 个文件到 Release $TAG"

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-${{ inputs.job }}
          path: /home/runner/share/${{ inputs.job }}/out/*
          if-no-files-found: warn
          retention-days: 15
